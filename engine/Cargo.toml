[package]
name = "dpifix-engine"
version = "0.2.0"
edition = "2021"
description = "DPI Fix için Rust motoru - WinDivert üzerinde çalışan DPI atlatma motoru"
license = "MIT"

[[bin]]
name = "dpifix-engine"
path = "src/main.rs"

# Harici bağımlılık yoktur. WinDivert.dll çalışma anında yüklenir.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
